name: Release

# Sur main : construit l'image, la teste (APP_ENV=staging), puis la publie sur GHCR (ghcr.io/nothineazi/mahaza-app : tags « latest » et SHA du commit).
# Authentification : GITHUB_TOKEN uniquement (aucun secret à configurer), permission « packages: write ».
# L'image est construite ici, jamais sur le serveur de staging (STANDARDS §1, ADR-018).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nothineazi/mahaza-app

jobs:
  image:
    name: Image GHCR (build, test, publication)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image (chargée en local pour le test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de l'image (APP_ENV=staging)
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ENV=staging "$IMAGE:test"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET /api/health -> $code"
          [ "$code" = "200" ]
          # Bandeau « données fictives » visible
          curl -fsS http://127.0.0.1:3000/ | grep -q "Version de développement – données fictives"
          curl -fsS http://127.0.0.1:3000/admin | grep -q "Version de développement – données fictives"
          # Liens WhatsApp sans destinataire : aucun lien wa.me avec un numéro dans les pages servies
          for p in / /reserver /admin; do
            if curl -fsS "http://127.0.0.1:3000$p" | grep -Eq 'wa\.me/[0-9]'; then echo "Lien WhatsApp avec destinataire sur $p"; exit 1; fi
          done
          # Utilisateur non-root
          [ "$(docker exec app id -u)" != "0" ]

      - name: Journaux du conteneur
        if: always()
        run: docker logs app || true

      - name: Publication (latest et SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
