name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Contrastes WCAG AA (thèmes clair et sombre)
        run: npm run check:contrast
      - name: Anti-fuite de marque
        run: npm run check:brand
      - run: npm run build
      - name: Budget de First Load JS
        run: npm run measure:first-load -- --budget scripts/first-load-budget.json

  # Job séparé (parallèle) : le build est refait ici pour ne pas allonger la chaîne de vérification.
  e2e:
    name: Smoke e2e (375 et 1280 px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Image Docker et /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build de l'image
        run: docker build -t ovatech-spa-core:ci .
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ENV=staging ovatech-spa-core:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET /api/health -> $code"
          [ "$code" = "200" ]
          curl -fsS http://127.0.0.1:3000/ | grep -q "Version de développement – données fictives"
      - name: Journaux du conteneur
        if: always()
        run: docker logs app || true
